schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Domain: local multilingual (es/en/pt) biblical-reflection narration, turned into
  narrated MP3s, then captioned videos, then YouTube-ready assets — for a small team
  producing a weekly series. Full architecture/decisions: docs/rfc-narrator-studio.md
  (read it before creating artifacts for Mx Narrator Studio changes).

  Existing, working component: `mx_narrator` (src/mx_narrator/, Python 3.11, uv-managed,
  renamed from `narrator` — the RFC and archived OpenSpec history below still refer to it
  by the old name) — a CLI that already does prep -> chunk -> Chatterbox V3/Kokoro
  synthesis -> ffmpeg assembly -> ID3-tagged MP3, with real voice cloning. Treat it as a
  stable dependency to orchestrate, not rewrite (RFC §11 "Reused From narrator" lists the
  exact integration points, e.g. `src/mx_narrator/batch.py::render_job()`).

  New system being built around it ("Mx Narrator Studio"): FastAPI backend, React 19 +
  Vite frontend (plain JS, no TypeScript, inline CSS-in-JS — matches the sibling
  project /home/geo/develop/projects/ebpi), Temporal workflows (self-hosted Docker,
  Python SDK), MongoDB (Motor async driver), all self-hosted via Docker Compose on a
  GPU-equipped host that already has `nvidia` as the Docker default runtime and a
  private registry at docker-registry.mixwarecs-home.net:5000.

  Hard constraints from the RFC, don't relitigate without flagging it explicitly:
  - No YouTube API integration of any kind (no OAuth, no upload) — the system stops at
    finished video + LLM-generated metadata staged for manual upload. This was
    explicitly designed, then explicitly reversed once already (RFC §12 Decision Log).
  - Every consequential pipeline step pauses for explicit human approval via Temporal
    signals (RFC §8) — correctness-check mismatches, SRT review (always, not just on
    mismatch), and metadata review. Never remove a human gate to simplify a workflow.
  - Correctness check between Whisper's transcript and mx_narrator's known TTS input text
    is exact-text comparison, not fuzzy/LLM judgment — the real risk is SRT timestamp
    sync against the final assembled (post-concatenation, post-speed-adjustment) audio,
    not content ambiguity (RFC §7.4).
  - Video: single static background image (no waveform/animation), captions burned
    directly into the picture (a soft/selectable track alone proved invisible in every
    real player and on YouTube itself; a `mov_text` track is still muxed in alongside
    the burned-in text) (RFC §10).
  - The episode title is NOT LLM-generated — it's the human-authored `unit_id`
    (confirmed to already match each script's own stated title), with a short
    LLM-written subtitle appended after it as `"{unit_id} | {subtitle}"`. Only
    description and tags are freely LLM-generated (RFC §12 Decision Log,
    openspec/specs/workflow/metadata-generation/spec.md).
  - Live progress in the UI via MongoDB change streams -> Server-Sent Events, not
    polling; structured JSON logs to stdout; Temporal's native Prometheus metrics
    enabled but no Grafana/log-aggregation stack in v1 (RFC §10.1).

